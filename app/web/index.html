<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeafRead · 留一点时间给阅读</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/reader.css"><link rel="manifest" href="/manifest.json"></head><body>
<div id="library" class="shell"><aside class="sidebar"><a class="brand" href="/"><span class="brand-mark">L</span>LeafRead</a><div class="caption">属于你的阅读角落</div><nav><span class="nav-item active">▤　我的书架</span></nav><div class="sidebar-foot"><span class="dot"></span>书籍与进度，留在本地<br>v0.2.1 / READ AT YOUR PACE</div></aside><main class="main"><div class="topbar"><span class="section-label">LIBRARY / YOUR COLLECTION</span><label class="btn file-label">＋ 导入 TXT / EPUB<input id="file" type="file" accept=".txt,.epub" class="hidden"></label></div><div class="hero reading-hero"><div class="eyebrow">慢一点，读进去。</div><h1>留一点时间，给阅读。</h1><p class="muted">一本书，一段安静的时光。导入你自己的文本，从上次停下的地方继续。</p><div class="book-art" aria-hidden="true">▤</div></div><div class="toolbar"><h2>我的书架 <span id="book-count" class="small muted"></span></h2><input id="library-search" placeholder="搜索书名"></div><div id="books" class="books-grid"></div><footer>支持 TXT / EPUB · UTF-8 / UTF-16 / GB18030 · 单本默认128MiB，可配置 · 自动识别章节</footer></main></div>
<section id="reader" class="hidden"><header class="reader-header"><button id="back" class="btn secondary">← 书架</button><strong id="book-title"></strong><span class="spacer"></span><button id="toc-toggle" class="btn secondary">目录</button><button id="bookmark" class="btn secondary">＋ 书签</button><select id="theme" aria-label="阅读主题"><option value="warm">暖纸</option><option value="light">明亮</option><option value="dark">夜读</option></select><select id="font" aria-label="字号"><option value="18">18px</option><option value="20">20px</option><option value="24">24px</option><option value="28">28px</option></select></header>
<aside class="reader-toc" id="reader-toc" aria-label="目录与书签"><div class="caption">章节目录</div><div id="chapters"></div><div class="caption">我的书签</div><div id="marks"></div><div class="caption">搜索正文</div><form id="text-search-form"><input id="text-search" placeholder="关键词" maxlength="100" required><button class="btn secondary">搜索</button></form><div id="search-results"></div></aside><article class="reading-page"><div class="eyebrow" id="chapter-number"></div><h1 id="chapter-title"></h1><div id="body-text"></div><div class="row chapter-nav"><button id="prev" class="btn secondary">← 上一章</button><span class="spacer"></span><button id="next" class="btn secondary">下一章 →</button></div><p class="small muted" id="save-state">阅读进度自动保存</p></article></section><div class="toast" id="toast" role="status"></div><script src="/common.js"></script><script src="/app.js"></script><script src="/offline.js"></script><script src="/accounts.js"></script><script src="/library.js"></script><script src="/import.js"></script><script src="/reading.js"></script><script src="/illustrations.js"></script></body></html>
